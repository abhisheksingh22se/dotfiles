onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

[keys]
# Leave prefix untouched (defaults to ctrl+b)
prefix = "ctrl+b"

# Remap session detach to 'q' to avoid conflict with your new split binding
detach = "prefix+q"

# --- Mirroring WezTerm Bindings ---

# 1. Close Pane ('w')
close_pane = "prefix+w"

# 2. Splits ('d' and 'Shift+d')
# Note: Multiplexers usually call side-by-side splits "vertical", 
# which matches WezTerm's "SplitHorizontal" behavior.
split_vertical = "prefix+d"       # Side-by-side split (d)
split_horizontal = "prefix+shift+d"     # Stacked split (Shift + d)

# 3. Navigation ('h', 'j', 'k', 'l')
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 5. Workspaces ('S', 'N', 'O', 'P', 'R')
switch_workspace = "prefix+1..9"
workspace_picker = "prefix+shift+s"
new_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+o"
next_workspace = "prefix+shift+p"
rename_workspace = "prefix+shift+r"
