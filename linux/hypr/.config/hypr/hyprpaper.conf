# ~/.config/hypr/hyprpaper.conf
#
# Wallpaper daemon. Images live in ~/Wallpaper — that directory is the convention this
# repo assumes, not something it ships (images don't belong in a dotfiles repo):
#
#   mkdir -p ~/Wallpaper && cp <your wallpaper> ~/Wallpaper/current.png
#
# `preload` takes a literal path, not a glob, so ~/Wallpaper/current.png is the file
# this config actually loads. The rest of the folder is there for waypaper to pick
# from — and note that waypaper *rewrites this file* when you choose an image through
# it, so anything you hand-edit here below the preload/wallpaper lines can be lost on
# the next pick. Set the folder once in waypaper (it defaults to ~/Pictures) so the
# two agree.
#
# Hyprland's blur reads whatever is behind a window, so a dark, low-contrast,
# slightly-textured wallpaper is what makes the frosted glass look like glass. A busy
# or bright one turns every translucent surface into noise.

preload = ~/Wallpaper/current.png

# Empty monitor field = every output, current and future.
wallpaper = , ~/Wallpaper/current.png

splash = false
ipc = on
