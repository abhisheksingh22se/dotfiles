# ~/.config/hypr/hypridle.conf
#
# Display sleep, lock and suspend. **Hyprland has no idle handling of its own** — if
# this daemon isn't running, the screen simply never turns off, which is exactly the
# stock-install behaviour. `hyprland.lua` autostarts it; confirm with `pgrep hypridle`.
#
# The ladder below follows macOS Energy Saver defaults: dim first as a warning, then
# lock, then blank the panel, then suspend — but only on battery, the way a MacBook
# stays awake on the charger.
#
#   0:30 before each step the dim acts as the "are you still there" cue
#   2:30  dim screen + keyboard backlight
#   5:00  lock
#   5:30  display off
#  30:00  suspend (battery only)

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lock instances
    before_sleep_cmd = loginctl lock-session    # lock before the screen goes away
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the panel back up reliably
    ignore_dbus_inhibit = false                 # respect mpv/browser "keep awake"
    ignore_systemd_inhibit = false
}

# 2:30 — dim the backlight as a warning. brightnessctl -s saves the current value so
# -r restores whatever you had, rather than jumping to a hardcoded level.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2:30 — the G14's keyboard backlight is a separate device.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 5:00 — lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 — display off. This is the one that was missing: DPMS on Wayland is the
# compositor's to perform, and nothing asks it to without a listener like this.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30:00 — suspend, on battery only. hypridle has no notion of power source, so the
# check lives in the helper script next to this file. Replace it with a plain
# `systemctl suspend` if you'd rather it always suspends.
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/idle-suspend
}
