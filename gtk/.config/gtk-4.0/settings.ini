# ~/.config/gtk-4.0/settings.ini
#
# This file exists for one reason: something has to *name* an icon theme.
#
# Installing papirus-icon-theme (Archfile) only puts files in /usr/share/icons; it
# does not make anything use them. With no theme named anywhere, every XDG icon
# lookup falls through to `hicolor`, which ships almost no real icons — so Ambxst's
# workspace indicators call Quickshell.iconPath(<app icon>, "image-missing") and get
# nothing back, because on a bare install even "image-missing" is unresolvable.
# That is why the workspace pills showed no app icons.
#
# GTK apps read this; the gsettings write in hyprland.lua's startup covers Qt and
# Quickshell, which look the value up through the appearance portal instead.
[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-theme-name=Adwaita-dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-font-name=Inter 11
