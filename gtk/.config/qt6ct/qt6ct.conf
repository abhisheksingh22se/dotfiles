# ~/.config/qt6ct/qt6ct.conf
#
# QT_QPA_PLATFORMTHEME=qt6ct is exported in hyprland.lua; this is what it reads.
#
# icon_theme is the Qt half of the problem the GTK settings.ini files solve. It is
# the one that actually matters for Ambxst: Quickshell is a Qt app, so this is where
# its workspace-indicator icons get resolved from.
#
# Fonts are deliberately not set here. qt6ct stores them as binary @Variant blobs
# that are not hand-writable; set them once through the `qt6ct` GUI and it will
# append the correct encoding itself.
[Appearance]
icon_theme=Papirus-Dark
style=Fusion
