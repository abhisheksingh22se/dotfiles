# ~/.config/hypr/hyprpaper.conf
#
# Wallpaper daemon. Point `preload`/`wallpaper` at real files before first use —
# the paths below are the convention this repo assumes, not files it ships (images
# don't belong in a dotfiles repo).
#
#   mkdir -p ~/Pictures/wallpapers && cp <your wallpaper> ~/Pictures/wallpapers/current.png
#
# Hyprland's blur reads whatever is behind a window, so a dark, low-contrast,
# slightly-textured wallpaper is what makes the frosted glass look like glass. A busy
# or bright one turns every translucent surface into noise.

preload = ~/Pictures/wallpapers/current.png
wallpaper = , ~/Pictures/wallpapers/current.png

splash = false
ipc = on
