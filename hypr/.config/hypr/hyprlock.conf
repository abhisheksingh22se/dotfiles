# ~/.config/hypr/hyprlock.conf
#
# Lock screen. Same glass vocabulary as sketchybarrc: blurred background, a single
# translucent capsule, white-at-60% text, mint accent from wezterm.lua.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot                 # blur the desktop itself, like macOS does
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# ── Time ──
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.92)
    font_size = 88
    font_family = SF Pro Display Thin, Inter Light, Hack Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

# ── Date — same format string as sketchybar's clock.sh ──
label {
    monitor =
    text = cmd[update:60000] date +"%a %b %d"
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = SF Pro Display, Inter, Hack Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# ── Password capsule ──
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0.125)     # sketchybar bracket border 0x20ffffff
    inner_color = rgba(0, 0, 0, 0.145)           # sketchybar bracket fill  0x25000000
    font_color  = rgba(255, 255, 255, 0.85)
    check_color = rgba(110, 235, 145, 0.9)       # wezterm active-tab mint
    fail_color  = rgba(255, 105, 120, 0.9)       # wezterm bright red

    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff80">Password</span>
    fail_text = <span foreground="##ff6978">$FAIL ($ATTEMPTS)</span>

    position = 0, -40
    halign = center
    valign = center
}

# ── Battery, because this is a laptop ──
label {
    monitor =
    text = cmd[update:30000] printf "%s%%" "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --)"
    color = rgba(255, 255, 255, 0.45)
    font_size = 14
    font_family = Hack Nerd Font
    position = -30, -20
    halign = right
    valign = top
}
